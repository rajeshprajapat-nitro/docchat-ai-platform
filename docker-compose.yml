version: "3.9"

services:
  backend:
    build: ./backend
    container_name: docchat-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - backend_db:/app/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: docchat-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE=http://localhost:8000
    restart: unless-stopped

volumes:
  backend_db:
